<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeckGuard ニュースリーダー</title>
  <style>
    /* ===== BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== SCREENS ===== */
    .screen { display: none; }
    .screen.active { display: flex; }

    /* ===== START SCREEN ===== */
    #screen-start {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }
    #screen-start h1 {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 8px;
    }
    #screen-start p {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.6;
      max-width: 300px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px 28px;
      margin: 8px;
      width: 80vw;
      max-width: 340px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .card-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
      text-align: left;
    }

  

    /* start button */
    #btn-start {
      margin-top: 28px;
      padding: 14px 36px;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      width: 80vw;
      max-width: 340px;
      font-weight: bold;
      transition: background 0.2s;
    }
    #btn-start:active { background: #1d4ed8; }

.mode-btn {
  flex: 1;
  padding: 10px 8px;
  font-size: 0.85rem;
  font-weight: bold;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  background: white;
  color: #888;
  cursor: pointer;
  transition: all 0.2s;
}
.mode-active {
  border-color: #2563eb;
  background: #2563eb;
  color: white;
}

    /* ===== READER SCREEN ===== */
    #screen-reader, 
    #screen-reader2 {
      flex-direction: column;
      min-height: 100vh;
      background: #f0f4f8;
    }

    .reader-topbar {
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .reader-topbar .topic-tag {
      font-size: 0.75rem;
      font-weight: bold;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    #btn-finish {
      padding: 7px 20px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      background: #dc2626;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-finish:active,
    #btn-finish2:active { background: #b91c1c; }

    #btn-finish2 {
  padding: 7px 20px;
  font-size: 0.85rem;
  font-weight: bold;
  border: none;
  border-radius: 999px;
  background: #dc2626;
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}

    .article-body {
      padding: 24px 20px 60px;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .article-kicker {
      font-size: 0.75rem;
      font-weight: bold;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .article-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #111;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .article-meta {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .article-lead {
      font-size: 1rem;
      font-weight: bold;
      color: #222;
      line-height: 1.75;
      margin-bottom: 18px;
    }
    .article-text {
      font-size: 0.95rem;
      color: #444;
      line-height: 1.85;
    }
    .article-text p { margin-bottom: 16px; }
    .article-text h3 {
      font-size: 1rem;
      font-weight: bold;
      color: #222;
      margin: 24px 0 8px;
    }
    .article-text blockquote {
      border-left: 3px solid #2563eb;
      padding-left: 14px;
      color: #666;
      font-style: italic;
      margin: 20px 0;
    }

    .art-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    #yellow-signal {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  left: 50%;
  transform: translate(-50%, -160%);
  width: calc(100% - 16px); max-width: 420px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(40,40,45,0.95); color: white;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  font-size: 1.1rem; line-height: 1.4;
  opacity: 0; pointer-events: none;
  transition: transform 0.35s ease, opacity 0.35s ease;
  z-index: 50;
}
#yellow-signal.active { transform: translate(-50%, 0); opacity: 1; }
#yellow-signal .n-icon { font-size: 1.4rem; }
#yellow-signal .n-app { font-size: 0.7rem; opacity: 0.7; }

    #calib-status { font-size: 0.75rem; color: #888; }
    .slider-hint { font-size: 0.75rem; color: #aaa; margin-top: 8px; text-align: left; }

    /* ===== POSTURE OVERLAY ===== */
    #overlay {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .overlay-icon {
      font-size: 3rem;
      margin-bottom: 14px;
      animation: sway 1.8s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-10deg); }
      50%       { transform: rotate(10deg); }
    }
    .overlay-msg {
      font-size: 1.15rem;
      font-weight: bold;
      color: #111;
      text-align: center;
    }
    .overlay-sub {
      font-size: 0.85rem;
      color: #888;
      margin-top: 6px;
      text-align: center;
      padding: 0 32px;
    }

    /* ===== RESULT SCREEN ===== */
    #screen-result {
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
      min-height: 100vh;
    }
    #screen-result h2 {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 80vw;
      max-width: 340px;
      margin-bottom: 12px;
    }
    .stat-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 80vw;
      max-width: 340px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-card .s-label {
      font-size: 0.7rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card .s-val {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2563eb;
      line-height: 1;
    }
    .stat-card .s-val.danger { color: #dc2626; }
    .stat-card .s-unit {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 2px;
    }

    /* chart */
    .chart-card {
      background: white;
      border-radius: 14px;
      padding: 16px 14px 10px;
      width: 80vw;
      max-width: 340px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .chart-card .chart-title {
      font-size: 0.78rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    #result-chart { width: 100%; display: block; }

    /* table */
    .table-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      width: 80vw;
      max-width: 340px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .table-card table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .table-card thead { background: #2563eb; color: white; }
    .table-card thead th { padding: 9px 10px; text-align: left; font-size: 0.75rem; }
    .table-card tbody tr { border-bottom: 1px solid #f0f4f8; }
    .table-card tbody tr:last-child { border-bottom: none; }
    .table-card tbody td { padding: 8px 10px; color: #444; }
    .table-card tbody tr:nth-child(even) { background: #f9fafb; }
    .td-bad { color: #dc2626; font-weight: bold; }

    /* result buttons */
    .result-btn-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 80vw;
      max-width: 340px;
    }
    .btn-blue {
      padding: 13px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-blue:active { background: #1d4ed8; }
    .btn-outline {
      padding: 13px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 2px solid #d1d5db;
      border-radius: 999px;
      background: white;
      color: #555;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-outline:active { background: #f3f4f6; }
  </style>
</head>
<body>

<div id="yellow-signal">
  <span class="n-icon">📱</span>
  <div>
    <div class="n-app">NeckGuard</div>
    <div>姿勢が乱れています。</div>
  </div>
</div>

<!-- ===== OVERLAY ===== -->
<div id="overlay">
  <div class="overlay-icon">🧍</div>
  <div class="overlay-msg">姿勢を正しましょう</div>
  <div class="overlay-sub">スマホを持ち直して、<br>背筋を伸ばしてください</div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="screen-start" class="screen active">
  <h1>NeckGuard ニュースリーダー</h1>
  <p>記事を読みながら、スマホの傾きを自動で記録。</p>

  <div id="admin-panel" style="display:none; flex-direction:column; align-items:center;">
  <div class="card">
    <div class="card-label">記事を選択</div>
    <div class="art-grid">
      <button class="mode-btn mode-active" data-art="1">記事1</button>
      <button class="mode-btn" data-art="2">記事2</button>
      <button class="mode-btn" data-art="3">記事3</button>
      <button class="mode-btn" data-art="4">記事4</button>
    </div>
  </div>
  <div class="card">
    <div class="card-label">モード</div>
    <div class="btn-row">
      <button id="btn-calib-on" class="mode-btn" onclick="setCalib(true)">閾値設定</button>
      <button id="btn-calib-off" class="mode-btn mode-active" onclick="setCalib(false)">計測</button>
    </div>
  </div>
  <div class="card" id="card-feedback">
    <div class="card-label">介入システム</div>
    <div class="btn-row">
      <button id="btn-fb-on" class="mode-btn" onclick="setFeedback(true)">ON</button>
      <button id="btn-fb-off" class="mode-btn mode-active" onclick="setFeedback(false)">OFF</button>
    </div>
    <div class="slider-hint">現在の閾値：<strong id="th-display">未設定</strong>
      <a href="#" id="th-reset" style="margin-left:8px;color:#2563eb">リセット</a></div>
  </div>
</div>


<button id="btn-start">記事を読む</button>   
</div>   

<!-- ===== READER SCREEN ===== -->
<div id="screen-reader" class="screen">
  <div class="reader-topbar">
    <span class="topic-tag" id="r-tag"></span>
    <span id="calib-status"></span>
    <button id="btn-finish">読み終わった</button>
  </div>
  <div class="article-body">
    <div class="article-kicker" id="r-kicker"></div>
    <h1 class="article-title" id="r-title"></h1>

    <p class="article-lead" id="r-lead"></p>
    <div class="article-text" id="r-body"></div>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result" class="screen">
  <h2>姿勢レポート</h2>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="s-label">平均角度</div>
      <div class="s-val" id="res-avg">—</div>
      <div class="s-unit">度</div>
    </div>
    <div class="stat-card">
      <div class="s-label">最大角度</div>
      <div class="s-val" id="res-max">—</div>
      <div class="s-unit">度</div>
    </div>
    <div class="stat-card">
      <div class="s-label">最小角度</div>
      <div class="s-val danger" id="res-min">—</div>
      <div class="s-unit">度</div>
    </div>
  </div>

    <div class="stat-grid">
    <div class="stat-card">
      <div class="s-label">計測回数</div>
      <div class="s-val" id="res-count">—</div>
      <div class="s-unit">回</div>
    </div>
    <div class="stat-card">
      <div class="s-label">黄色信号</div>
      <div class="s-val danger" id="res-yellow">—</div>
      <div class="s-unit">回</div>
    </div>
    <div class="stat-card">
      <div class="s-label">赤信号</div>

  </div>

  <div class="chart-card">
    <div class="chart-title">角度の推移（1秒ごと）</div>
    <canvas id="result-chart" height="130"></canvas>
  </div>


  <div class="result-btn-wrap">
    <button class="btn-blue" id="btn-csv">CSVをダウンロード</button>
    <button class="btn-outline" id="btn-restart">もう一度計測する</button>
  </div>
</div>

<script>
  // ===== STATE =====
  const CAL_START = 3000;   // 閾値算出区間(ms)
  const YELLOW_MS = 500, RED_MS = 3000;      // 閾値超過からの経過(ms)
  let threshold = null;
  try { const t = localStorage.getItem('ng_threshold'); if (t !== null) threshold = +t; } catch(e){}
  let records = [], grouped = [];
  let intervalId = null, startTime = 0;
  let currentBeta = 0, currentArticle = 1, feedbackOn = false;
  let calibAngles = [], calibDone = false;
  let calibMode = false;
  let belowSince = null, evY = 0, evR = 0;

  // ===== DOM =====
  const $start   = document.getElementById('screen-start');
  const $reader  = document.getElementById('screen-reader');
  const $result  = document.getElementById('screen-result');
  const $overlay = document.getElementById('overlay');
  const $yellow  = document.getElementById('yellow-signal');

  function show(el) {
    [$start, $reader, $result].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  // ===== 記事選択 / フィードバック切替 =====
  function updateThDisplay() {
    document.getElementById('th-display').textContent = threshold === null ? '未設定' : threshold.toFixed(1) + '°';
  }
  function setFeedback(on) {
    feedbackOn = on;
    if (on && calibMode) setCalib(false);
    document.getElementById('btn-fb-on').classList.toggle('mode-active', on);
    document.getElementById('btn-fb-off').classList.toggle('mode-active', !on);
  }
  function setCalib(on) {
  calibMode = on;
  document.getElementById('btn-calib-on').classList.toggle('mode-active', on);
  document.getElementById('btn-calib-off').classList.toggle('mode-active', !on);
  if (on) setFeedback(false);
}
let tapN = 0, tapT = null;
document.querySelector('#screen-start h1').addEventListener('click', () => {
  tapN++; clearTimeout(tapT); tapT = setTimeout(() => tapN = 0, 1500);
  if (tapN >= 5) {
    tapN = 0;
    const p = document.getElementById('admin-panel');
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  }
});

  document.querySelectorAll('[data-art]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentArticle = +btn.dataset.art;
    document.querySelectorAll('[data-art]').forEach(b => b.classList.toggle('mode-active', b === btn));
  });
});
  document.getElementById('th-reset').addEventListener('click', e => {
    e.preventDefault();
    threshold = null;
    try { localStorage.removeItem('ng_threshold'); } catch(e){}
    updateThDisplay();
  });
  updateThDisplay();

  // ===== 記事データ =====
  const ARTICLES = {
    1: { tag:'テクノロジー', kicker:'AI・科学技術', title:'医療現場で広がる人工知能：活用の現状と課題', meta:'2025年6月 · 読了目安 4分',
      lead:`人工知能（AI）が医療の現場で使われ始めている。画像診断や薬の開発などで活用が進む一方、個人情報の扱いや責任の所在といった課題も指摘されている。`,
      body:`
<p>医療の分野で、人工知能（AI）を活用する動きが広がっている。AIとは、大量のデータから特徴や規則性を学び、人間が行う判断の一部を手助けするコンピューターの技術である。高齢化で医療を必要とする人が増える一方、医師や看護師の数には限りがあり、診察や検査の負担を軽くする手段として期待されている。近年は病院の検査や事務作業などで実際に使われる例も増え、患者の目に触れる機会も多くなった。政府も医療分野でのAI活用を後押ししており、研究や実証の取り組みが各地で行われている。AIがどのような場面で使われ、どのような点に注意が必要なのかを整理する。</p>
<p>現在、最も活用が進んでいるのは画像の分析である。レントゲンやCT、内視鏡などの画像をAIが読み取り、病気の疑いがある部分を知らせる仕組みが、国内外の病院で導入されている。AIは過去に集められた多数の画像を学習しており、人の目では気づきにくい小さな変化を見つけられる場合がある。研究では、特定の病気について、AIが専門医に近い精度で画像を判定できたという報告もある。検査の件数が増えても、一定の品質を保ちやすくなる点も利点とされる。とくに、がんの検診のように多数の画像を短時間で確認する場面では、AIの支援が役立つと考えられている。画像を読む専門医が不足している地域でも、診断を支える手段になり得るとされる。ただし、現時点でAIは診断を単独で行うものではない。結果を確認して最終的な判断を下すのは医師であり、AIは見落としを減らすための補助役と位置づけられている。</p>
<p>身近な例として、大腸の内視鏡検査がある。検査中、医師はカメラの映像を見ながら、がんの元になるポリープを探す。小さいものや平らなものは、周囲の粘膜と見分けにくく、見落としが起こることがある。AIを組み合わせたシステムでは、映像をAIが同時に分析し、ポリープの疑いがある場所を画面上に表示する。国内でもこうした装置が医療機器として承認されており、一部の医療機関で使われている。患者にとっても、検査の精度が安定することは、病気の早期発見につながる可能性がある。こうした装置が承認を受けるには、性能や安全性が審査される。経験の差によって生じやすい見落としを減らし、検査の質をそろえる効果が期待されている。切除するかどうかは、これまでどおり医師が判断する。</p>
<p>診断以外の場面でも活用は進んでいる。たとえば、薬の開発では、候補となる化合物をコンピューター上で調べて絞り込み、試験にかかる期間や費用を減らす試みがある。新しい薬が実用化されるまでには、一般に十年以上かかるとされ、その短縮が期待されている。また、入院中の患者の体温や血圧などのデータを常に分析し、容体が悪くなる前兆を看護師に知らせる仕組みも、一部の病院で試されている。早めに気づくことで、適切な対応につなげやすくなると考えられている。診察の内容を文章にまとめる作業をAIが手伝い、医師の事務負担を減らす取り組みもある。このように、AIは診察室の外でも、医療を支える裏方として働き始めている。AIが担うのは、人が行う判断を支える部分に限られている。</p>
<p>一方で、課題も残っている。第一に、医療データは極めて重要な個人情報であり、安全な管理が欠かせない。第二に、AIがなぜその結果を出したのかが分かりにくい場合があり、医師や患者が納得して使えるよう、説明のしかたが問われている。第三に、AIの判断が誤っていた場合に誰が責任を負うのかについて、制度の整備が途上にある。また、AIは学習したデータに左右されるため、データに偏りがあると、特定の年代や性別などの人々に対して精度が下がる可能性も指摘されている。さらに、AIの結果を信頼しすぎて、医師が自分で考える機会が減ってしまうのではないかという懸念もある。使う側が、AIの得意なことと苦手なことを理解しておく必要がある。こうした点を確かめながら、安全に使うための基準づくりが各国で進められている。</p>
<p>AIは、医師に代わるものではなく、医師の判断を支える道具として使われ始めている。画像診断や薬の開発、患者の見守りなど、活用の範囲は今後も広がるとみられる。一方で、データの保護や責任の所在といった点について、専門家や行政、医療機関による議論と制度づくりが続いている。技術の進歩だけでなく、使い方のルールを整えることも同じように重要である。今後は、どの場面でAIを使い、どの場面で人が判断するのかを明確にしておくことが一層大切になる。患者にとっても、どのような場面でAIが使われているのかを知っておくことは、安心して医療を受ける助けになるだろう。</p>` },

    2: { tag:'環境・社会', kicker:'環境・サステナビリティ', title:'海洋プラスチックごみ：各国の取り組みと残された課題', meta:'2025年6月 · 読了目安 4分',
      lead:`海に流れ込むプラスチックごみが、世界的な課題になっている。各国で規制や回収の取り組みが進む一方、ごみを減らすには国際的な協力と生活の見直しが必要とされている。`,
      body:`
<p>海に流れ込むプラスチックごみが、世界的な課題となっている。ペットボトルや袋、漁具などのプラスチックは軽くて丈夫で安価なため、暮らしや産業に欠かせない素材である。しかし、使い終わったあとに適切に処理されなかったものが川や海に流れ出し、海の生き物や環境に影響を与えることが懸念されている。海岸でごみを目にした経験を持つ人も多いだろう。プラスチックごみは、一度海に出ると回収が難しく、長い期間残り続けることから、早い段階での対策が求められている。日本の周辺海域でも、海岸に漂着するごみの量が調査されている。この問題の現状と各国の取り組み、そして残された課題を整理する。</p>
<p>国際的な推計では、毎年およそ800万トンのプラスチックごみが海に流れ込んでいるとされる。その多くは、陸地で出たごみが川や風によって海へ運ばれたものだと考えられている。プラスチックは自然にはほとんど分解されず、紫外線や波の力で細かく砕かれて、「マイクロプラスチック」と呼ばれる5ミリ以下の粒になる。こうした粒は海水や海底の泥、魚や貝の体内からも見つかっている。海鳥やウミガメが、えさと間違えてプラスチックを食べてしまう例も報告されている。海岸に打ち上げられたごみの調査では、ペットボトルや漁具、食品の包装が多く確認されている。漁網やひもが体にからまって動けなくなる被害も、各地で報告されている。人体への影響については、現在も研究が続けられている。</p>
<p>対策として、各国は規制を進めている。欧州連合（EU）は2021年から、ストローや綿棒、発泡スチロール製の容器など、代わりの製品がある使い捨てプラスチックの販売を禁止した。韓国やカナダなどでも、使い捨て製品を規制する制度が導入されている。日本では2020年にレジ袋の有料化が始まり、2022年にはプラスチック資源循環促進法が施行された。この法律は、事業者に対して、プラスチック製品の使用量の削減や、回収・再利用の促進を求めている。2019年のG20大阪サミットでは、2050年までに海洋プラスチックごみによる新たな汚染をゼロにすることを目指す方針が共有された。こうした規制は、環境への影響を減らすだけでなく、企業が製品や包装を見直すきっかけにもなっている。</p>
<p>企業や研究機関の取り組みも広がっている。飲料メーカーの中には、ペットボトルに再生素材を使う割合を高める目標を掲げるところがある。紙やバイオマス由来の素材で作った容器やストローも、店頭で見かけるようになった。回収の面では、川の河口にごみを集める装置を置いたり、海岸の清掃活動を市民が行ったりする例がある。漁業の現場でも、使われなくなった漁網を回収し、衣類や日用品の原料として再利用する取り組みが始まっている。飲食店などで、ストローやスプーンを紙や木のものに切り替える動きも広がっている。企業の側には、環境への配慮を示すことで、消費者から評価を得たいという事情もある。日本の研究チームが、PETというプラスチックを分解する細菌を報告するなど、分解技術の研究も進められている。</p>
<p>ただし、課題は少なくない。海に出てしまった細かなごみを回収するのは難しく、費用もかかるため、流れ出る前に減らす対策が重要とされている。リサイクルの仕組みが十分に整っていない地域では、ごみの回収や処理そのものが難しいという事情もある。また、ごみの量や流れを把握するための調査方法が統一されていないことも、対策を難しくしている。代わりの素材にも、価格や強度、製造時の環境への負荷といった点で一長一短があり、どれが最適かは用途によって異なる。また、ごみは海流に乗って国境を越えるため、一国の対策だけでは十分でない。国際的な取り決めづくりも議論されてきたが、各国の事情や立場の違いから、調整には時間がかかっている。こうした事情から、対策の効果を測ることも簡単ではなく、継続的な調査が欠かせない。</p>
<p>海洋プラスチックの問題は、規制、企業の取り組み、技術開発、そして個人の行動が重なり合って対応が進められている分野である。問題は、国や企業だけで解決できるものではなく、消費者を含む多くの主体が関わる点に特徴がある。プラスチックは便利な素材であり、完全になくすことは現実的ではない。必要な場面では使いながら、無駄を減らし、使ったあとはきちんと回収するという考え方が重視されている。国や企業の対策に加え、利用者が選ぶ商品や使い方も、需要を通じて社会の方向性に影響を与えるとされる。マイバッグやマイボトルの利用、分別の徹底など、日常でできる取り組みもある。効果が表れるまでには時間がかかるとみられるが、問題の仕組みと現状を知ることが、無理のない形で関わる第一歩になるだろう。</p>` },

    3: { tag:'健康・科学', kicker:'睡眠・脳科学', title:'睡眠と記憶の関係：研究で分かってきたこと', meta:'2025年6月 · 読了目安 4分',
      lead:`睡眠は、体を休めるだけでなく、日中に得た情報を整理し記憶として定着させる時間と考えられている。睡眠と学習の関係について、研究で分かっていることを紹介する。`,
      body:`
<p>勉強や仕事のために睡眠時間を削った経験を持つ人は、少なくないだろう。試験の前夜や締め切りの前に、少しでも時間を確保しようと考えるのは自然なことである。しかし近年の研究では、睡眠は単なる休息ではなく、日中に得た情報を整理し、記憶として定着させる大切な時間だと考えられるようになっている。睡眠と記憶の関係に注目した研究は、世界各地で行われている。睡眠時間を確保することと、学習の成果を高めることは、両立しないものと受け止められがちである。睡眠と記憶の関係について、これまでに分かっていることを紹介する。</p>
<p>睡眠は、一晩中同じ状態が続くわけでない。眠りに入ると、まず脳の活動が静まる「ノンレム睡眠」が現れ、その後、脳が比較的活発に動く「レム睡眠」に移る。この二つが約90分の周期で入れ替わり、一晩に数回繰り返される。脳波を測定すると、こうした段階の違いを調べることができる。一般に、眠りの前半には深いノンレム睡眠が多く、後半になるほどレム睡眠の割合が増えるとされる。ノンレム睡眠は、体と脳を休ませる役割も持つ。睡眠の周期は年齢や体調によっても変わり、個人差がある。日中に学んだことは、脳の「海馬」という部分に一時的にたくわえられ、特にノンレム睡眠の間に整理されて、長く保存される場所へ移されていくという見方が有力である。レム睡眠は、感情に関わる記憶の整理などに関わるとされる。</p>
<p>この関係を調べた実験は数多くある。たとえば、単語や手順を覚えてもらった参加者を、睡眠をとるグループと、起きたままで過ごすグループに分け、一定時間後に思い出せる量を比べた研究がある。多くの研究で、睡眠をとったグループのほうが成績が高い傾向にあると報告されている。睡眠不足の状態で学習すると、覚えられる量が減りやすいことも、複数の実験で示されている。睡眠中に、日中の出来事をもとにした脳の活動が再び現れることを示す研究もある。眠る前に覚えた内容のほうが、朝起きてから思い出しやすかったという実験結果もある。学生を対象とした調査でも、睡眠時間が十分な人のほうが、学習への集中力が高いという報告がある。短い昼寝にも、午後の集中力を回復させる効果があるとされ、15〜20分ほどの仮眠が一つの目安として紹介されることが多い。</p>
<p>では、睡眠の質を保つにはどうすればよいのか。専門家がよく挙げるのは、毎日ほぼ同じ時刻に寝起きすることである。休日に長く寝すぎると体内時計がずれ、週明けに眠りにくくなることがある。朝に日光を浴びること、夕方以降はカフェインを控えること、寝る前は部屋を暗めにして落ち着いて過ごすことも、よく眠るための工夫とされている。食事や運動の時間帯、入浴のタイミングを整えることも、眠りやすさに関わるとされる。起床後に軽く体を動かしたり、朝食をとったりすることも、体内時計を整える助けになるとされる。寝る直前に食事をとりすぎたり、強い光を浴びたりすることは、寝つきを悪くする原因になりうる。こうした習慣は、特別な道具がなくても始められるが、効果の感じ方には個人差がある。厚生労働省も、年代に応じた睡眠の目安などをまとめた指針を公表している。</p>
<p>一方で、睡眠が足りない人は少なくない。国際的な調査では、日本の平均睡眠時間は比較対象となった国の中で短い部類に入るとされる。仕事や学業、家事、通勤などで、睡眠時間が削られやすい事情もある。近年は、睡眠の大切さを伝える啓発活動や、勤務時間の見直しを進める企業も出てきている。睡眠不足が続くと、集中力や判断力が下がるほか、長期的には健康への影響も指摘されている。ただし、必要な睡眠時間には個人差があり、「何時間寝れば十分」と一律に言い切ることはできない。また、睡眠と記憶の仕組みには、まだ解明されていない部分も多く、研究は現在も続けられている。「睡眠負債」という言葉は、睡眠不足が積み重なった状態を指して使われることがある。睡眠の質を測る機器も普及しているが、その結果をどこまで信頼できるかについては、慎重な見方もある。</p>
<p>睡眠は、日中の活動で得た情報を整理し、定着させる役割を持つと考えられている。時間が足りないときに睡眠を削るのは手軽な方法に見えるが、学習や仕事の成果という点では、必ずしも得策とは限らない。睡眠は、勉強や仕事の合間にとる休息というより、その成果を支える土台の一つと捉えることができる。短期間の我慢で済むと考えても、積み重なった睡眠不足は、後から取り戻しにくいことがある。睡眠は、削りやすい時間であると同時に、削ったときの影響が見えにくい時間でもある。自分に合った睡眠時間を知り、規則的な生活を心がけることが、日々の活動を支える第一歩になる。</p>` },

    4: { tag:'エネルギー・社会', kicker:'エネルギー・環境', title:'再生可能エネルギーの現状：普及の進展と今後の課題', meta:'2025年6月 · 読了目安 4分',
      lead:`太陽光や風力など、再生可能エネルギーの導入が世界で進んでいる。日本の現状や取り組みの例とともに、電力の安定供給や地域との関わりといった課題を整理する。`,
      body:`
<p>太陽光や風力など、自然の力を利用して発電する再生可能エネルギーの導入が、世界で進んでいる。発電時に二酸化炭素をほとんど出さず、国内で得られる資源を使えることから、気候変動への対策やエネルギーの安定確保の手段として位置づけられている。日本でも、住宅の屋根に取り付けられた太陽光パネルや、海沿いの風車を目にする機会が増えた。国も、再生可能エネルギーを主要な電源として拡大していく方針を示している。天候や季節に左右されやすい点には、注意が必要とされる。導入の現状と取り組みの例、そして今後の課題を整理する。</p>
<p>太陽光や風力の発電費用は、技術の進歩と生産量の増加により、この十数年で大きく下がった。国や地域によっては、新しい発電所をつくる際に、再生可能エネルギーが最も費用の低い選択肢の一つになっている。日本では2012年に固定価格買取制度が始まり、太陽光発電の導入が急速に進んだ。国土に占める平地の面積が小さいため、住宅や工場の屋根、使われなくなった土地などを活用した設置が広がっている。風力発電も、陸上や海上で導入が進んでいる。発電設備の導入は、地域の産業や雇用にもつながるとされ、自治体が主導する事業も見られる。ただし、導入が進んだ分、電気の買い取りにかかる費用や、系統への接続といった新たな課題も生じている。現在、日本の発電量のうち、再生可能エネルギーが占める割合は約2割とされる。</p>
<p>新しい技術の開発も続いている。その一つが「ペロブスカイト太陽電池」である。薄くて軽く、曲げることもできるため、従来のパネルでは重さの面で設置が難しかった建物の壁や屋根にも取り付けられる可能性がある。日本の研究成果が基になっており、実用化に向けた開発が進められている。メーカーや大学などが共同で研究を行い、量産に向けた技術開発や、設置方法の検討が続いている。また、海に囲まれた日本では、海上に風車を設置する洋上風力発電にも期待が寄せられ、各地で調査や計画が行われている。屋根や壁面など、これまで使われていなかった場所に設置できれば、導入できる量の増加が見込まれる。陸上に比べて安定した風が得られやすく、大型の風車を置きやすいことが、期待の理由とされる。</p>
<p>発電量の変動に対応するための取り組みもある。昼間に余った電気を蓄電池にためて夕方以降に使う方法は、その代表である。大型の蓄電設備を電力会社などが設置するほか、家庭用の蓄電池を導入する世帯もある。また、地域をまたいで電気をやり取りしやすくするため、送電線を増強する計画も進められている。電力の使い方を工夫する取り組みも広がっている。たとえば、電気が余りやすい昼間に、洗濯や充電などの利用を促す料金プランを設ける事業者もある。さらに、電気自動車の電池を、電力の調整に活用する研究も行われている。天気予報をもとに発電量を予測し、ほかの発電所の運転を調整する技術も、安定供給を支える手段として使われている。こうした取り組みを組み合わせることで、発電量の変動の影響を小さくしようとしている。</p>
<p>課題も指摘されている。太陽光は夜間に発電できず、風力は風の強さに左右されるため、天候によって発電量が変わる。電気は使う量と作る量を常に合わせる必要があり、変動する電源が増えるほど調整が難しくなる。また、発電に適した場所と電気を多く使う都市が離れていることが多く、送電網の整備には時間と費用がかかる。再生可能エネルギーの発電量が一時的に需要を上回り、発電を止めるよう求められる場合もある。地域との関係も重要で、大規模な発電所の建設に伴う景観の変化や、斜面の造成による防災面の不安、風車の騒音などをめぐり、住民との話し合いが求められる場面がある。古くなった太陽光パネルを、将来どのように処分し再利用するかも、検討が進められている課題の一つである。さらに、導入を支える費用は電気料金を通じて利用者も負担しており、そのあり方も議論されている。</p>
<p>再生可能エネルギーは、導入を増やす段階から、安定した供給と地域との調和を両立させる段階へ移りつつある。技術の開発や制度の見直しに加え、電力会社や発電事業者、自治体、住民の間での丁寧な合意づくりが欠かせない。どの電源にも長所と短所があり、再生可能エネルギーだけですべてをまかなうことは容易でない。複数の電源を組み合わせて、バランスよく使うことが現実的な方向とされている。家庭でも、電力プランの選択や省エネなど、関わる方法がある。どの方法を選ぶかは、費用や環境への影響、地域の事情などを総合的に考えて決める必要がある。自分の暮らしと電力のつながりを知ることが、今後の議論を考える手がかりになるだろう。</p>` }
  };

  function loadArticle(n) {
    const a = ARTICLES[n];
    document.getElementById('r-tag').textContent = a.tag;
    document.getElementById('r-kicker').textContent = a.kicker;
    document.getElementById('r-title').textContent = a.title;
    document.getElementById('r-meta').textContent = a.meta;
    document.getElementById('r-lead').textContent = a.lead;
    document.getElementById('r-body').innerHTML = a.body;
    window.scrollTo(0, 0);
  }
  // ===== START =====
  document.getElementById('btn-start').addEventListener('click', () => {
        if (!calibMode && feedbackOn && threshold === null) {
      alert('フィードバックONには、先に閾値設定モードで閾値を設定してください。'); return;
    }
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(r => {
          if (r === 'granted') { startSession(); }
          else { alert('センサーの許可が必要です。'); }
        }).catch(console.error);
    } else {
      startSession();
    }
  });

  
  function startSession() {
    document.getElementById('admin-panel').style.display = 'none';
    records = []; calibAngles = []; calibDone = false;
    belowSince = null; evY = 0; evR = 0;
    applyState('good');
    loadArticle(currentArticle);
    document.getElementById('calib-status').textContent = '';
    currentBeta = 0;
    window.addEventListener('deviceorientation', onOrientation);
    show($reader);
    startTime = Date.now();
    intervalId = setInterval(tick, 100);
  }

  function applyState(state) {
    $yellow.classList.toggle('active', state === 'yellow');
    $overlay.classList.toggle('active', state === 'red');
  }

  function median(a) {
    const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function finishCalibration() {
    calibDone = true;
    const med = median(calibAngles);
    const mad = median(calibAngles.map(a => Math.abs(a - med)));
    threshold = med - 1 * (mad * 1.4826);
    try { localStorage.setItem('ng_threshold', threshold); } catch(e){}
  }

  function tick() {
    const now = Date.now(), elapsed = now - startTime;
    const angle = Math.abs(Math.round(currentBeta));

            if (calibMode) {
      const st = document.getElementById('calib-status');
      if (elapsed < CAL_START) {
        st.textContent = '準備中 ' + Math.ceil((CAL_START - elapsed) / 1000);
      } else {
        st.textContent = '';
        calibAngles.push(angle);
      }
    }

    // 状態判定（記事2〜4・閾値あり）。ON/OFFに関わらず状態は記録する
    let state = 'good', below = null;
    if (!calibMode && threshold !== null && elapsed >= CAL_START) {
      below = angle < threshold;
       if (below) {
        const d = now - belowSince;
        state = d >= RED_MS ? 'red' : d >= YELLOW_MS ? 'yellow' : 'good';
      } else belowSince = null;
      if (feedbackOn) applyState(state);
    }
    records.push({ time: new Date(now), elapsed, angle, state, below });
  }

  // ===== ORIENTATION =====
  function onOrientation(e) {
    currentBeta = e.beta !== null ? e.beta : 0;
  }

  // ===== FINISH =====
   document.getElementById('btn-finish').addEventListener('click', () => {
    clearInterval(intervalId);
    window.removeEventListener('deviceorientation', onOrientation);
    applyState('good');
        if (calibMode && !calibDone && calibAngles.length > 0) {
      finishCalibration();
    }
    showResult();
  });

  // ===== RESULT =====
  function showResult() {
    if (!records.length) {
      alert('データが記録されませんでした。');
      show($start); return;
    }
    grouped = [];
    for (let i = 0; i < records.length; i += 10) {
      const slice = records.slice(i, i + 10);
      const avg10 = Math.round(slice.reduce((a, b) => a + b.angle, 0) / slice.length);
      grouped.push({ time: slice[0].time, angle: avg10 });
    }
    const angles = grouped.map(r => r.angle);
    const avg    = Math.round(angles.reduce((a,b)=>a+b,0) / angles.length);
    const mx     = Math.max(...angles);
    const mn     = Math.min(...angles);

  
    
        let prev = 'good'; evY = 0; evR = 0;
    records.forEach(r => {
      if (r.state === 'yellow' && prev === 'good') evY++;
      if (r.state === 'red' && prev !== 'red') evR++;
      prev = r.state;
    });
    

  

    show($result);
    requestAnimationFrame(() => drawChart(angles));  // 表示後に描画
  }

  // ===== CHART =====
  function drawChart(angles) {
    const canvas = document.getElementById('result-chart');
    const ctx    = canvas.getContext('2d');
    const dpr    = window.devicePixelRatio || 1;
    const W      = canvas.offsetWidth;
    const H      = 130;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const pad = { t:8, r:8, b:22, l:28 };
    const cW  = W - pad.l - pad.r;
    const cH  = H - pad.t - pad.b;
    const maxV = Math.max(...angles, (threshold ?? 0) + 5, 10);

    ctx.clearRect(0, 0, W, H);

    // grid
    [0, 0.5, 1].forEach(f => {
      const y = pad.t + cH*(1-f);
      ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+cW, y); ctx.stroke();
      ctx.fillStyle = '#aaa'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(Math.round(maxV*f), pad.l-3, y+3);
    });

    // threshold line
    

    if (angles.length < 2) return;
    const step = cW / (angles.length - 1);
   

    // fill
    const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t+cH);
    grad.addColorStop(0, 'rgba(37,99,235,0.18)');
    grad.addColorStop(1, 'rgba(37,99,235,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t+cH);
    angles.forEach((a,i) => {
      const x = pad.l + i*step;
      const y = pad.t + cH*(1 - a/maxV);
      i===0 ? ctx.lineTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.lineTo(pad.l+cW, pad.t+cH); ctx.closePath(); ctx.fill();

    // line
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    angles.forEach((a,i) => {
      const x = pad.l + i*step;
      const y = pad.t + cH*(1 - a/maxV);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();

    // dots
    angles.forEach((a,i) => {
      const x = pad.l + i*step;
      const y = pad.t + cH*(1 - a/maxV);
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
    });
  }

  // ===== CSV =====
   document.getElementById('btn-csv').addEventListener('click', () => {
    // サマリー行
    const angles = grouped.map(r => r.angle);
    const avg    = Math.round(angles.reduce((a,b)=>a+b,0) / angles.length);
    const mx     = Math.max(...angles);
    const mn     = Math.min(...angles);
    const med = median(angles);
    const judged = records.filter(r => r.below !== null);
    const nBelow = judged.filter(r => r.below).length;
    let evB = 0, pb = false;
    judged.forEach(r => { if (r.below && !pb) evB++; pb = r.below; });
    const rateB = judged.length ? (nBelow / judged.length * 100).toFixed(1) : '';

    const summary = [
      ['【サマリー】',''],
      ['平均角度(°)', avg],
      ['最大角度(°)', mx],
      ['最小角度(°)', mn],
      ['中央値(°)', med],
      ['計測回数(回)', records.length],
      ['記事番号', currentArticle],
      ['モード', calibMode ? '閾値設定' : '計測'],
      ['フィードバック', feedbackOn ? 'ON' : 'OFF'],
      ['閾値(°)', threshold === null ? '未設定' : threshold.toFixed(2)],
      ['黄色信号回数', evY],
      ['赤信号回数', evR],
      ['閾値超過回数', judged.length ? evB : ''],
      ['閾値超過率(%)', rateB],   
      ['',''],  // 空行
      ['【生データ】',''],
      ['#','時刻','経過(秒)','角度(°)','状態']
    ];

    const label = { good:'良好', yellow:'黄', red:'赤' };
    const rows = [...summary];
    records.forEach((r,i) => rows.push([
      i+1,
      r.time.toLocaleString('ja-JP'),
      (r.elapsed/1000).toFixed(1),
      r.angle,
      label[r.state]
    ]));

    const csv  = '\uFEFF' + rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `NeckGuard_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.csv`;
    a.click(); URL.revokeObjectURL(url);
  });

  // ===== RESTART =====
  document.getElementById('btn-restart').addEventListener('click', () => {
    clearInterval(intervalId);
    window.removeEventListener('deviceorientation', onOrientation);
        applyState('good');
    records = [];
    updateThDisplay();
    show($start);
  });
  </script>
